<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maquillaje | V3E STORE</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .productos-container {
      max-width: 1200px;
      margin: 40px auto;
      background: #fffbe6cc;
      border-radius: 18px;
      box-shadow: 0 4px 24px rgba(44,58,32,0.13);
      padding: 36px 32px 28px 32px;
    }

    .productos-lista {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 32px;
      padding: 20px 0;
    }

    .producto-item {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(44,58,32,0.10);
      padding: 18px 12px 12px 12px;
      text-align: center;
      border: 2px solid #C8A2C8;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .producto-item img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 10px;
      background: #fac6cae3;
    }

    .producto-item h3 {
      font-size: 1.1em;
      color: #4B5320;
      margin-bottom: 6px;
    }

    .producto-item .precio {
      font-size: 1.1em;
      color: #9B70A8;
      font-weight: bold;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">V3E STORE</div>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="productos.html">Productos</a>
      <a href="ropa.html">Ropa</a>
      <a href="maquillaje.html">Maquillaje</a>
      <a href="skincare.html">Skincare</a>
      <a href="registro.html">Registro</a>
      <a href="contacto.html">Contacto</a>
    </nav>
  </header>

  <div class="productos-container">
    <h2>Maquillaje</h2>
    <div id="productosLista" class="productos-lista"></div>
  </div>

  <footer>
    <p>© 2025 V3E STORE - Todos los derechos reservados</p>
  </footer>

  <script>
    const productos = [
      {nombre:'Base Líquida Glow', precio:220, img:'base_liquida.jpg'},
      {nombre:'Polvo Compacto Mate', precio:180, img:'polvo_compacto.jpg'},
      {nombre:'Rubor Rosado', precio:95, img:'rubor_rosado.jpg'},
      {nombre:'Paleta Sombras Nude', precio:320, img:'paleta_nude.jpg'},
      {nombre:'Delineador Líquido', precio:70, img:'delineador_liquido.jpg'},
      {nombre:'Máscara de Pestañas', precio:110, img:'mascara_pestanas.jpg'},
      {nombre:'Labial Rojo Intenso', precio:85, img:'labial_rojo.jpg'},
      {nombre:'Labial Nude', precio:85, img:'labial_nude.jpg'},
      {nombre:'Corrector Líquido', precio:120, img:'corrector_liquido.jpg'},
      {nombre:'Iluminador Líquido', precio:140, img:'iluminador_liquido.jpg'},
      {nombre:'Bronzer Compacto', precio:130, img:'bronzer_compacto.jpg'},
      {nombre:'Gel de Cejas', precio:75, img:'gel_cejas.jpg'},
      {nombre:'Paleta Sombras Color', precio:340, img:'paleta_color.jpg'},
      {nombre:'Delineador en Lápiz', precio:60, img:'delineador_lapiz.jpg'},
      {nombre:'Gloss Transparente', precio:65, img:'gloss_transparente.jpg'}
    ];

    const contenedor = document.getElementById('productosLista');
    productos.forEach(prod => {
      const div = document.createElement('div');
      div.className = 'producto-item';
      div.innerHTML = `
        <img src="img/${prod.img}" alt="${prod.nombre}">
        <h3>${prod.nombre}</h3>
        <div class="precio">$${prod.precio}</div>
      `;
      contenedor.appendChild(div);
    });
  </script>
</body>
</html>
